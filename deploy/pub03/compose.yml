name: fleetops-pub03

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set private bootstrap password}
      FLEETOPS_DB_PASSWORD: ${FLEETOPS_DB_PASSWORD:?set private hex owner password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, max_connections=32, -c, shared_buffers=64MB, -c, work_mem=2MB, -c, maintenance_work_mem=32MB, -c, log_statement=none, -c, log_min_error_statement=panic]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/10-fleetops.sql:ro
    networks: [database]
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 96
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d fleetops]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *logging

  app:
    image: ${FLEETOPS_IMAGE:?set immutable release image tag or digest}
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 96
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      GOMEMLIMIT: 384MiB
      GOMAXPROCS: "2"
      FLEETOPS_MODE: production
      FLEETOPS_PUBLIC_ORIGIN: https://${FLEETOPS_HOST:?set approved DNS hostname}
      FLEETOPS_TRUSTED_PROXIES: 172.30.83.2/32,127.0.0.1/32
      FLEETOPS_DATABASE_URL: postgres://fleetops_owner:${FLEETOPS_DB_PASSWORD:?}@postgres:5432/fleetops?sslmode=disable
      FLEETOPS_ASSETS_DIR: /web
      FLEETOPS_EVIDENCE_DIR: /evidence
    volumes:
      - type: bind
        source: ${FLEETOPS_EVIDENCE_DIR:?set existing private Linux evidence directory}
        target: /evidence
        bind:
          create_host_path: false
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks:
      proxy:
        ipv4_address: 172.30.83.3
      database: {}
    healthcheck:
      test: [CMD, /healthcheck]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 20s
    logging: *logging

  caddy:
    image: ${CADDY_IMAGE:?set reviewed official Caddy image version or digest}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      FLEETOPS_HOST: ${FLEETOPS_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?set certificate contact email}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: {}
      proxy:
        ipv4_address: 172.30.83.2
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *logging

networks:
  edge: {}
  proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.83.0/29
  database:
    internal: true

volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
